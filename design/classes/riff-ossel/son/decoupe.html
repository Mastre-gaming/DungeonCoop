<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Découpe des sons Suno</title>
<style>
  :root { --fond:#1c1620; --carte:#2b2230; --texte:#f1e8dc; --rouge:#e6332e; --or:#f2c24b; --os:#d9cdb6; }
  body { margin:0; padding:20px 16px; background:var(--fond); color:var(--texte); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:820px; margin:0 auto; } h1 { font-size:24px; margin:0 0 4px; } p { color:var(--os); margin:0 0 14px; }
  #liste { display:grid; gap:8px; }
  .l { display:grid; grid-template-columns:70px 1fr 90px 150px; gap:10px; align-items:center; background:var(--carte); border-radius:8px; padding:8px 10px; }
  canvas { width:100%; height:36px; background:#17111b; border-radius:4px; }
  button, select { font:inherit; background:#3a2e42; color:var(--texte); border:2px solid #4a3a52; border-radius:8px; padding:4px 8px; cursor:pointer; }
  button:hover { border-color:var(--rouge); } .nom { color:var(--or); }
</style></head><body><main>
<h1>Découpe des sons Suno</h1>
<p>Chaque ligne est un coup détecté (au plus 3 s, normalisé). Écoute, puis range-le dans un sort avec la liste. « Garder » l'enregistre dans <code>dl/coupes/</code>.</p>
<div id="liste">Décodage…</div>
<script type="module">
  const buf = await (await fetch('../dl/suno.mp4')).arrayBuffer();
  const a = await new OfflineAudioContext(2, 44100, 44100).decodeAudioData(buf);
  const sr = a.sampleRate, L = a.getChannelData(0), R = a.getChannelData(1), n = a.length;
  // l'enveloppe, toutes les 10 ms, et les attaques : un bond de l'énergie par rapport à la moyenne des 150 ms d'avant
  const pas = Math.round(sr * 0.01), env = [];
  for (let i = 0; i + pas <= n; i += pas) { let s = 0; for (let k = 0; k < pas; k++) { const v = (L[i + k] + R[i + k]) / 2; s += v * v; } env.push(Math.sqrt(s / pas)); }
  const att = [];
  for (let i = 16; i < env.length - 5; i++) {
    let avant = 0; for (let k = 1; k <= 15; k++) avant += env[i - k]; avant /= 15;
    const apres = Math.max(env[i], env[i + 1], env[i + 2], env[i + 3]);
    const force = apres / (avant + 1e-5);
    if (force > 1.8 && apres > 0.012) att.push({ t: i * 0.01, force, niveau: apres });
  }
  // on ne garde qu'une attaque par 0,35 s : la plus forte
  const choisies = [];
  for (const x of att) { const d = choisies[choisies.length - 1]; if (d && x.t - d.t < 0.35) { if (x.force > d.force) choisies[choisies.length - 1] = x; } else choisies.push(x); }
  const maxNiv = Math.max(...choisies.map(c => c.niveau));
  const ac = new AudioContext();
  const LISTE = ['', 'Riff', 'Riff au contact', 'Ballade', 'Course effrénée', 'Power chord', 'Solo de la hache', 'Rythme +1', 'Rythme max', 'Blessé', 'K.O.'];
  function tranche(t0, dur) {
    const i0 = Math.max(0, Math.round((t0 - 0.02) * sr)), len = Math.round(dur * sr), out = new Float32Array(len);
    for (let k = 0; k < len && i0 + k < n; k++) out[k] = (L[i0 + k] + R[i0 + k]) / 2;
    let pic = 0; for (const v of out) pic = Math.max(pic, Math.abs(v));
    const g = 0.8 / (pic || 1), fin = Math.round(0.15 * sr);                         // on normalise à 0,8, avec un fondu de fin de 150 ms
    for (let k = 0; k < len; k++) out[k] *= g * (k > len - fin ? (len - k) / fin : 1);
    return out;
  }
  function wav(d) {
    const b = new DataView(new ArrayBuffer(44 + d.length * 2)), s = (o, t) => [...t].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
    s(0, 'RIFF'); b.setUint32(4, 36 + d.length * 2, true); s(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
    b.setUint32(24, sr, true); b.setUint32(28, sr * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true); s(36, 'data'); b.setUint32(40, d.length * 2, true);
    d.forEach((v, i) => b.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true));
    return b.buffer;
  }
  const liste = document.getElementById('liste'); liste.textContent = '';
  choisies.forEach((c, idx) => {
    const suivant = choisies[idx + 1], dur = Math.min(3, suivant ? Math.max(0.5, suivant.t - c.t + 0.1) : 3);
    const d = tranche(c.t, dur), div = document.createElement('div'); div.className = 'l';
    div.innerHTML = `<button>▶ ${c.t.toFixed(1)} s</button><canvas width="400" height="36"></canvas><span>${dur.toFixed(1)} s</span><span><select>${LISTE.map(x => `<option>${x}</option>`).join('')}</select> <button>Garder</button></span>`;
    const cv = div.querySelector('canvas').getContext('2d'); cv.fillStyle = '#e6332e';
    for (let x = 0; x < 400; x++) { let m = 0; const i0 = Math.floor(x / 400 * d.length), i1 = Math.floor((x + 1) / 400 * d.length); for (let k = i0; k < i1; k++) m = Math.max(m, Math.abs(d[k])); cv.fillRect(x, 18 - m * 17, 1, m * 34); }
    const [jouer, garder] = div.querySelectorAll('button'), sel = div.querySelector('select');
    jouer.onclick = async () => { await ac.resume(); const ab = ac.createBuffer(1, d.length, sr); ab.copyToChannel(d, 0); const s = ac.createBufferSource(); s.buffer = ab; s.connect(ac.destination); s.start(); };
    garder.onclick = async () => { if (!sel.value) return; const nom = sel.value.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '_' + c.t.toFixed(1) + 's.wav'; await fetch('/save?nom=' + nom, { method: 'POST', body: wav(d) }); garder.textContent = 'Gardé ✓'; };
    liste.append(div);
  });
  window.__attaques = choisies.map(c => +c.t.toFixed(2)); window.__fini = true;
</script></main></body></html>
